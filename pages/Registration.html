<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="../css/reset.css">
</head>
<body class="centering">
    <a href="../index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" class="escape">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M3.17007 3.17007C3.39682 2.94331 3.76447 2.94331 3.99122 3.17007L9 8.17884L14.0088 3.17007C14.2355 2.94331 14.6032 2.94331 14.8299 3.17007C15.0567 3.39682 15.0567 3.76447 14.8299 3.99122L9.82116 9L14.8299 14.0088C15.0567 14.2355 15.0567 14.6032 14.8299 14.8299C14.6032 15.0567 14.2355 15.0567 14.0088 14.8299L9 9.82116L3.99122 14.8299C3.76447 15.0567 3.39682 15.0567 3.17007 14.8299C2.94331 14.6032 2.94331 14.2355 3.17007 14.0088L8.17884 9L3.17007 3.99122C2.94331 3.76447 2.94331 3.39682 3.17007 3.17007Z" fill="#46A358"/>
        </svg>
    </a>

    <div id="one-or-two" >
        <span id="login-text">Login </span>
        <span id="cherta-text">  I </span>
        <span id="register-text"> Register</span>
    </div>
    <form action="#" method="get">
        <p id="text241">Enter your email and password to register.</p>
        <!-- ussername -->
        <div>
            <input
            class="input-style"
            type="text"
            name="ussername"
            tabindex="1"
            placeholder="Ussername">
        </div>
        <!-- email -->
        <div>
            <input
            type="email"
            name="email"
            tabindex="2"
            placeholder="Enter your email address"
            class="input-style">
        </div>
        <!-- password -->
        <div>
            <input
            type="password"
            name="usserpassword"
            tabindex="3"
            placeholder="Password"
            class="input-style">
        </div>
        <!-- confirmpassword -->
        <div>
            <input 
            type="password" 
            name="confirmpassword"
            class="input-style"
            tabindex="4"
            placeholder="Confirm Password">
        </div>
        <button id="submit-button" type="submit" tabindex="5">Register</button>
    </form>
    <!-- other method -->
    <div class="centering">
        <!-- Or register with -->
        <div id="div-or">
            <hr>
            <span>Or register with</span>
            <hr>
        </div>
        <!-- Continue with Google -->
         <div id="google-button">
            <img src="../img/register img/google1.png" alt="google-logo">
            <span>Continue with Google</span>
         </div>
         <!-- Continue with Facebook -->
          <div id="faceboock-button">
            <img src="../img/register img/facebook1.png" alt="faceboock-logo">
            <span>Continue with Facebook</span>
         </div>
    </div>
    <footer></footer>
</body>
</html>
