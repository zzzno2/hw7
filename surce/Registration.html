<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body class="centering">
    <div id="one-or-two" >
        <span id="login-text">Login </span>
        <span id="cherta-text">  I </span>
        <span id="register-text"> Register</span>
    </div>
    <form action="#" method="get">
        <p id="text241">Enter your email and password to register.</p>
        <!-- ussername -->
        <div>
            <input
            class="input-style"
            type="text"
            name="ussername"
            tabindex="1"
            placeholder="Ussername">
        </div>
        <!-- email -->
        <div>
            <input
            type="email"
            name="email"
            tabindex="2"
            placeholder="Enter your email address"
            class="input-style">
        </div>
        <!-- password -->
        <div>
            <input
            type="password"
            name="usserpassword"
            tabindex="3"
            placeholder="Password"
            class="input-style">
        </div>
        <!-- confirmpassword -->
        <div>
            <input 
            type="password" 
            name="confirmpassword"
            class="input-style"
            tabindex="4"
            placeholder="Confirm Password">
        </div>
        <button id="submit-button" type="submit" tabindex="5">Register</button>
    </form>
    <!-- other method -->
    <div class="centering">
        <!-- Or register with -->
        <div id="div-or">
            <hr>
            <span>Or register with</span>
            <hr>
        </div>
        <!-- Continue with Google -->
         <div id="google-button">
            <img src="../img/google1.png" alt="google-logo">
            <span>Continue with Google</span>
         </div>
         <!-- Continue with Facebook -->
          <div id="faceboock-button">
            <img src="../img/facebook1.png" alt="faceboock-logo">
            <span>Continue with Facebook</span>
         </div>
    </div>
    <footer></footer>
</body>
</html>
